<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        #map { height: 100vh; }
        .legend {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="legend" class="legend"></div>
    
    <script>
        const map = L.map('map').setView([55.76, 37.64], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQsodmn0YGSLfvdw17fThe8jFKYTd6ZYI68p8rQAwphZtx-iKPjbVldgdqOaYk8jBvv5IdBuNVy-Ynm/pub?gid=1122678898&single=true&output=csv';

        fetch(CSV_URL)
            .then(response => response.text())
            .then(csvText => {
                const data = Papa.parse(csvText, { header: true }).data;
                const colors = {};
                const legendHtml = ['<b>Округа Москвы</b>'];
                
                data.forEach(row => {
                    // Если есть координаты — маркер
                    if (row.lat && row.lng) {
                        L.marker([parseFloat(row.lat), parseFloat(row.lng)])
                            .bindPopup(row.name)
                            .addTo(map);
                    }
                    
                    // Если есть полный GeoJSON — полигон
                    if (row.geometry && row.geometry.startsWith('{')) {
                        try {
                            const geojson = JSON.parse(row.geometry);
                            const color = row.color || '#3388ff';
                            
                            L.geoJSON(geojson, {
                                style: {
                                    color: '#222',
                                    weight: 2,
                                    fillColor: color,
                                    fillOpacity: 0.7
                                }
                            })
                            .bindPopup(row.name)
                            .addTo(map);
                            
                            // Сохраняем для легенды
                            colors[row.name] = color;
                            legendHtml.push(`
                                <div style="display:flex;align-items:center;margin:4px 0;">
                                    <span style="display:inline-block;width:20px;height:20px;background:${color};border:1px solid #222;margin-right:8px;"></span>
                                    ${row.name}
                                </div>
                            `);
                        } catch(e) {
                            console.warn('Ошибка парсинга GeoJSON для', row.name, e);
                        }
                    }
                });
                
                // Показываем легенду
                document.getElementById('legend').innerHTML = legendHtml.join('');
            })
            .catch(error => {
                console.error('Ошибка загрузки данных:', error);
                document.getElementById('map').innerHTML = '<p style="color:red;text-align:center;padding:20px;">Ошибка загрузки данных. Проверьте консоль.</p>';
            });
    </script>
</body>
</html>
