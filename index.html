<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        #map { height: 100vh; width: 100%; margin: 0; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Скрываем атрибуцию OSM */
        .leaflet-control-attribution {
            display: none !important;
        }
        
        /* Стиль для легенды */
        .legend {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(255,255,255,0.95);
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.25);
            z-index: 1000;
            max-height: 70vh;
            overflow-y: auto;
            font-size: 13px;
            min-width: 160px;
            border: 1px solid #ddd;
        }
        .legend-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
            text-align: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 3px 0;
        }
        .legend-color {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 1px solid #555;
            margin-right: 8px;
            flex-shrink: 0;
            border-radius: 3px;
        }
        .legend-name {
            font-size: 13px;
        }
        .legend-value {
            margin-left: auto;
            padding-left: 10px;
            font-weight: 600;
            font-size: 12px;
            color: #555;
        }
        
        /* Стиль для подписей на карте */
        .district-label {
            background: rgba(255,255,255,0.85);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #333;
            box-shadow: 0 1px 5px rgba(0,0,0,0.15);
            text-align: center;
            pointer-events: none;
            line-height: 1.3;
            white-space: nowrap;
        }
        .district-label .value {
            font-weight: 400;
            font-size: 11px;
            color: #555;
            display: block;
        }
        
        /* Стиль для всплывающих окон */
        .custom-popup {
            font-size: 14px;
            text-align: center;
        }
        .custom-popup .popup-value {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="legend" class="legend"></div>
    
    <script>
        const map = L.map('map', {
            center: [55.76, 37.64],
            zoom: 10,
            zoomControl: true
        });
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // ССЫЛКА НА ВАШУ GOOGLE ТАБЛИЦУ
        // В таблице должны быть колонки: name, color, value, geometry (GeoJSON)
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQsodmn0YGSLfvdw17fThe8jFKYTd6ZYI68p8rQAwphZtx-iKPjbVldgdqOaYk8jBvv5IdBuNVy-Ynm/pub?gid=1122678898&single=true&output=csv';

        fetch(CSV_URL)
            .then(response => response.text())
            .then(csvText => {
                const data = Papa.parse(csvText, { header: true }).data;
                const colors = {};
                const legendHtml = ['<div class="legend-title">Округа Москвы</div>'];
                const labels = [];
                
                data.forEach(row => {
                    // Пропускаем пустые строки и Украину
                    if (!row.name || row.name === 'Украина' || row.name.trim() === '') return;
                    
                    const name = row.name.trim();
                    const color = row.color || '#3388ff';
                    const value = row.value || '';
                    
                    // --- 1. РИСУЕМ ПОЛИГОН (границы) ---
                    if (row.geometry && row.geometry.startsWith('{')) {
                        try {
                            const geojson = JSON.parse(row.geometry);
                            
                            const layer = L.geoJSON(geojson, {
                                style: {
                                    color: '#222',
                                    weight: 2.5,
                                    fillColor: color,
                                    fillOpacity: 0.75
                                }
                            }).addTo(map);
                            
                            // Всплывающее окно с названием и цифрой
                            const popupContent = `
                                <div class="custom-popup">
                                    <b>${name}</b><br>
                                    <span class="popup-value">${value}</span>
                                </div>
                            `;
                            layer.bindPopup(popupContent);
                            
                            // --- 2. ДОБАВЛЯЕМ ПОДПИСЬ В ЦЕНТРЕ ---
                            try {
                                const bounds = layer.getBounds();
                                if (bounds.isValid()) {
                                    const center = bounds.getCenter();
                                    
                                    const labelHtml = `
                                        <div class="district-label">
                                            ${name}
                                            <span class="value">${value}</span>
                                        </div>
                                    `;
                                    
                                    const labelIcon = L.divIcon({
                                        className: 'label',
                                        html: labelHtml,
                                        iconSize: [0, 0],
                                        iconAnchor: [0, 0]
                                    });
                                    
                                    L.marker(center, { icon: labelIcon, interactive: false })
                                        .addTo(map);
                                    
                                    // Сохраняем данные для легенды
                                    colors[name] = color;
                                    labels.push({ name, color, value });
                                }
                            } catch(e) {
                                console.warn('Не удалось добавить подпись для', name);
                            }
                            
                        } catch(e) {
                            console.warn('Ошибка парсинга GeoJSON для', name, e);
                        }
                    }
                });
                
                // --- 3. СТРОИМ ЛЕГЕНДУ ---
                // Сортируем по названию
                const sortedLabels = labels.sort((a, b) => a.name.localeCompare(b.name));
                
                sortedLabels.forEach(item => {
                    legendHtml.push(`
                        <div class="legend-item">
                            <span class="legend-color" style="background:${item.color};"></span>
                            <span class="legend-name">${item.name}</span>
                            <span class="legend-value">${item.value}</span>
                        </div>
                    `);
                });
                
                document.getElementById('legend').innerHTML = legendHtml.join('');
                
                // --- 4. ПОДГОНЯЕМ КАРТУ ПОД ГРАНИЦЫ ---
                try {
                    const allBounds = L.latLngBounds(
                        labels.map(l => l.center).filter(c => c)
                    );
                    if (allBounds.isValid()) {
                        map.fitBounds(allBounds, { padding: [30, 30] });
                    }
                } catch(e) {
                    // Если не удалось — оставляем стандартный вид
                }
                
            })
            .catch(error => {
                console.error('Ошибка загрузки данных:', error);
                document.getElementById('map').innerHTML = `
                    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:30px;border-radius:10px;box-shadow:0 0 30px rgba(0,0,0,0.3);text-align:center;z-index:1000;">
                        <p style="color:red;font-size:18px;">❌ Ошибка загрузки данных</p>
                        <p style="font-size:14px;color:#666;">Проверьте консоль (F12) для деталей</p>
                    </div>
                `;
            });
    </script>
</body>
</html>
